  <rect x="322" y="212" width="48" height="48" rx="7" fill="#0EA5E9"/>
  <text x="346" y="247" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">B</text>
  <rect x="332" y="164" width="38" height="38" rx="6" fill="#8B5CF6" transform="rotate(-8 351 183)"/>
  <text x="351" y="191" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" transform="rotate(-8 351 183)">C</text>
