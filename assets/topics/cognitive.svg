    <path d="M200 30 V44"/><path d="M148 52 L158 62"/><path d="M252 52 L242 62"/>
    <path d="M128 100 H142"/><path d="M258 100 H272"/>
  </g>
  <circle cx="200" cy="100" r="40" fill="#FDE68A" stroke="#F59E0B" stroke-width="4"/>
  <path d="M184 100 q8 -16 16 0 q8 -16 16 0" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 100 V132" stroke="#F59E0B" stroke-width="3"/>
  <rect x="184" y="138" width="32" height="14" rx="4" fill="#94A3B8"/>
  <rect x="190" y="152" width="20" height="8" rx="4" fill="#64748B"/>
  <!-- books -->
  <rect x="96" y="232" width="208" height="28" rx="5" fill="#4F46E5"/>
  <rect x="112" y="204" width="176" height="28" rx="5" fill="#10B981"/>
