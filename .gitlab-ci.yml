stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

.run_on:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

check:
  extends: .run_on
  stage: lint
  image: python:3.11-slim
  script:
    - pip install ruff
    - ruff check .
    - python -m compileall -q src ui app.py

test:
  extends: .run_on
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt coverage
    - coverage run -m unittest discover -s tests -t . -v
    - coverage report --include="src/*,ui/*"
  coverage: '/TOTAL.*\s+(\d+%)$/'

docker-build:
  extends: .run_on
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t semantic-explorer .
  allow_failure: true
